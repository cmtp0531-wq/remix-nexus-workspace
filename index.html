    <style>
      /* 첫 페인트 즉시 표시 (React 마운트 전 스플래시) */
      html, body { margin: 0; padding: 0; background: #FDFBF7; }
      #boot-splash {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #FDFBF7; color: #2C2520; font-family: 'Noto Sans KR', system-ui, sans-serif;
      }
      #boot-splash .dots { display: flex; align-items: flex-end; gap: 6px; height: 28px; }
      #boot-splash .dots span { width: 8px; border-radius: 999px; background: #3E2723; animation: bootBounce 1s infinite ease-in-out; }
      #boot-splash .dots span:nth-child(1) { height: 16px; background: #8D5B4C; }
      #boot-splash .dots span:nth-child(2) { height: 26px; animation-delay: .12s; }
      #boot-splash .dots span:nth-child(3) { height: 20px; background: #C18C5D; animation-delay: .24s; }
      @keyframes bootBounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    </style>
  </head>
  <body class="bg-[#FDFBF7] text-[#2C2520] antialiased selection:bg-[#E6DCD0] selection:text-[#3E2723] m-0 p-0 min-h-screen overflow-x-hidden">
    <div id="root" class="min-h-screen flex flex-col">
      <div id="boot-splash">
        <div style="display:flex;flex-direction:column;align-items:center;gap:10px">
          <div class="dots"><span></span><span></span><span></span></div>
          <p style="font-size:12px;color:#7A6A5C;margin:0">워크스페이스를 여는 중…</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
